# Publica a imagem e troca a instância cloud: por tag v* ou pelo botão.
# Configure no GitHub (Settings → Secrets and variables → Actions → Variables):
#   AWS_ROLE_ARN   tofu -chdir=infra output -raw github_role_arn
#   BUCKET_BUILD   tofu -chdir=infra output -raw bucket_build
name: nuvem

on:
  # Deploy só quando você quiser: uma tag de versão (git tag v1.2 && git
  # push origin v1.2) ou o botão "Run workflow" na aba Actions. Push comum
  # na master não publica mais (cada deploy é um build no CodeBuild).
  push:
    tags: ["v*"]
  workflow_dispatch:

# Dois pushes seguidos: o segundo espera o primeiro, nunca rodam juntos.
concurrency:
  group: nuvem
  cancel-in-progress: false

permissions:
  id-token: write # o token OIDC que a AWS troca por credencial de 1 h
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # As linhas da falha viram anotações: aparecem no resumo do run (e na
      # API pública) sem precisar abrir o log, que exige login de admin.
      - name: testes
        run: |
          set -o pipefail
          if ! go test ./... 2>&1 | tee /tmp/testes.log; then
            grep -E -- '--- FAIL|^FAIL|_test\.go:[0-9]+|panic:' /tmp/testes.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: imagem (CodeBuild)
        run: go run ./cmd/publicar-imagem --bucket "${{ vars.BUCKET_BUILD }}" --projeto ozymandias-imagem --regiao us-east-1

      - name: trocar a instância cloud
        run: |
          aws ecs update-service --cluster ozymandias --service ozymandias-nuvem --force-new-deployment --query 'service.serviceName' --output text
          aws ecs wait services-stable --cluster ozymandias --services ozymandias-nuvem
          echo "nuvem em ${GITHUB_SHA::7}"
