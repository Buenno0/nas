<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Ozymandias NAS</title>
<link rel="icon" href="/telas-erro/ozymandias-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14; --bg-2: #101219; --line: #1c1f27; --line-2: #2b3040;
    --text: #f2f3f7; --muted: #8b90a0; --faint: #5f6577;
    --numeral: #161a24;
    --stone: #333850; --stone-2: #3f4661; --cut: #1a1e2a;
    --dune-0: #15182190; --dune-1: #191d29; --dune-2: #1e2331;
    --violet: #8b7cff; --amber: #e0824a;
    --btn-bg: #f2f3f7; --btn-fg: #0d0f14;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #efe0c8; --bg-2: #f7ecd9; --line: #ddcaa8; --line-2: #c2a879;
      --text: #2b2118; --muted: #6b5540; --faint: #8a6a44;
      --numeral: #e2cfab;
      --stone: #2b2118; --stone-2: #c98f3c; --cut: #efe0c8;
      --dune-0: #e0c9a4; --dune-1: #d8bd95; --dune-2: #cfb086;
      --violet: #a8642c; --amber: #9c3f1d;
      --btn-bg: #2b2118; --btn-fg: #efe0c8;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Archivo', system-ui, -apple-system, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--violet); text-decoration: none; }
  a:hover { color: var(--text); }
  .topbar {
    position: relative; z-index: 3; display: flex; align-items: center; gap: 10px;
    padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--bg-2);
  }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(150deg, #8b7cff, #4b7bec); display: flex; align-items: center; justify-content: center; }
  .brand { font-size: 14px; font-weight: 600; }
  .path { margin-left: auto; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: var(--faint); }
  main {
    position: relative; min-height: calc(100vh - 57px); overflow: hidden;
    display: flex; align-items: center; justify-content: flex-end;
    padding: 56px 7vw;
    background: radial-gradient(120% 90% at 50% 6%, var(--bg-2) 0%, var(--bg) 62%);
  }
  .dunes, .numeral { position: absolute; inset: 0; width: 100%; height: 100%; }
  .numeral { display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .numeral span { font-size: min(38vw, 400px); font-weight: 700; letter-spacing: -0.04em; line-height: 1; color: var(--numeral); user-select: none; }
  .copy { position: relative; z-index: 2; width: 470px; max-width: 100%; display: flex; flex-direction: column; gap: 20px; }
  .eyebrow { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--violet); }
  h1 { margin: 0; font-size: clamp(30px, 4.4vw, 46px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; text-wrap: pretty; }
  .quote { margin: 0; padding-left: 16px; border-left: 2px solid var(--line-2); font-style: italic; font-size: 15px; line-height: 1.75; color: var(--muted); text-wrap: pretty; }
  .quote cite { display: block; font-style: normal; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.12em; color: var(--faint); }
  .lead { margin: 0; font-size: 15px; line-height: 1.7; color: var(--muted); max-width: 420px; text-wrap: pretty; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; padding-top: 4px; }
  .btn { display: inline-flex; align-items: center; gap: 9px; padding: 13px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; }
  .btn-primary { background: var(--btn-bg); color: var(--btn-fg); }
  .btn-ghost { border: 1px solid var(--line-2); color: var(--muted); font-weight: 500; }
  @media (max-width: 860px) {
    main { align-items: flex-start; justify-content: flex-start; padding: 48px 24px 140px; min-height: calc(100vh - 57px); }
    .numeral { align-items: flex-start; padding-top: 26vh; }
    .numeral span { font-size: 46vw; }
    .actions { position: fixed; left: 24px; right: 24px; bottom: 28px; flex-direction: column; gap: 10px; z-index: 3; }
    .btn { justify-content: center; padding: 15px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 96 96" fill="none" aria-hidden="true">
        <path d="M18 22 C18 14 27 9 48 9 C69 9 78 14 78 22 L78 52 C78 68 66 80 48 87 C30 80 18 68 18 52 Z" fill="#ffffff"/>
        <circle cx="37" cy="53" r="8" fill="#4b41b8"/><circle cx="59" cy="53" r="8" fill="#4b41b8"/>
        <path d="M41 66 L41 78 L55 72 Z" fill="#4b41b8"/>
      </svg>
    </div>
    <span class="brand">NAS Ozymandias</span>
    <span class="path">erro 404</span>
  </header>
  <main>
    <div class="numeral"><span>404</span></div>
    <svg class="dunes" viewBox="0 0 820 420" preserveAspectRatio="xMinYMax slice" aria-hidden="true">
      <path d="M0 250 C120 220 200 268 320 258 C450 248 520 210 640 226 C720 236 780 258 820 250 L820 420 L0 420 Z" fill="var(--dune-0)"/>
      <g transform="rotate(-72 146 292) translate(56 224) scale(1.85)">
        <path d="M18 22 C18 14 27 9 48 9 C69 9 78 14 78 22 L78 52 C78 68 66 80 48 87 C30 80 18 68 18 52 Z" fill="var(--stone)"/>
        <path d="M24 24 C24 18 32 14 48 14 C64 14 72 18 72 24 L72 34 L24 34 Z" fill="var(--stone-2)"/>
        <rect x="24" y="36" width="48" height="4" fill="var(--stone-2)"/>
        <circle cx="37" cy="53" r="8" fill="var(--cut)"/>
        <circle cx="59" cy="53" r="8" fill="var(--cut)"/>
        <path d="M41 66 L41 78 L55 72 Z" fill="var(--cut)"/>
      </g>
      <path d="M0 316 C140 288 240 336 380 326 C520 316 600 278 740 298 C780 304 800 314 820 310 L820 420 L0 420 Z" fill="var(--dune-1)"/>
      <path d="M0 362 C160 342 300 372 460 366 C620 360 720 334 820 352 L820 420 L0 420 Z" fill="var(--dune-2)"/>
    </svg>
    <div class="copy">
      <div class="eyebrow">Erro 404</div>
      <h1>Nada resta deste caminho</h1>
      <blockquote class="quote">&ldquo;Contemplai minha obra, ó Poderosos, e desesperai!&rdquo;<cite>Shelley, 1818</cite></blockquote>
      <p class="lead">A página que você procurou não existe mais — ou nunca existiu. Só areia ao redor.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Voltar ao acervo</a>
        <a class="btn btn-ghost" href="/search">Buscar</a>
      </div>
    </div>
  </main>
</body>
</html>
