<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <style>
    /* Mesma geometria e mesmas cores da marca do app: corpo, touca, olhos e
       o play. Claro é a paleta de areia; escuro, a violeta. O favicon segue o
       tema do sistema, que é o único sinal que uma aba consegue ler. */
    .corpo { fill: #2b2118 }
    .touca { fill: #c98f3c; opacity: 1 }
    .olhos { fill: #efe0c8 }
    .play  { fill: #a8642c }
    @media (prefers-color-scheme: dark) {
      .corpo { fill: #8b7cff }
      .touca { fill: #0d0f14; opacity: 0.35 }
      .olhos { fill: #0d0f14 }
      .play  { fill: #0d0f14 }
    }
  </style>
  <path class="corpo" d="M18 22 C18 14 27 9 48 9 C69 9 78 14 78 22 L78 52 C78 68 66 80 48 87 C30 80 18 68 18 52 Z"/>
  <path class="touca" d="M24 24 C24 18 32 14 48 14 C64 14 72 18 72 24 L72 34 L24 34 Z"/>
  <rect class="touca" x="24" y="36" width="48" height="4"/>
  <circle class="olhos" cx="37" cy="53" r="8"/>
  <circle class="olhos" cx="59" cy="53" r="8"/>
  <path class="play" d="M41 66 L41 78 L55 72 Z"/>
</svg>
