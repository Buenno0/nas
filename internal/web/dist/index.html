    <script>
      // Aplica o tema antes da primeira pintura, para não piscar branco.
      // Escuro é o padrão; claro só entra se a pessoa tiver escolhido.
      (function () {
        try {
          var theme = localStorage.getItem('nas-theme') === 'light' ? 'light' : 'dark'
          document.documentElement.classList.remove('dark', 'light')
          document.documentElement.classList.add(theme)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'light' ? '#f6f3ee' : '#0c0a08')
        } catch (e) {}
      })()
    </script>
